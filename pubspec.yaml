name: lazy_ally
description: "Make your Flutter app accessible with one widget: system-aware theming, IBM color-blind-safe support, reduce-motion, and screen-reader announcements, using stock Flutter only."
version: 1.0.1
homepage: https://github.com/okunamutata/lazy_ally
repository: https://github.com/okunamutata/lazy_ally
issue_tracker: https://github.com/okunamutata/lazy_ally/issues
topics:
  - accessibility
  - a11y
  - theme
  - color
  - animation

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
