name: lazy_ally
description: "Make your Flutter app accessible with one widget: system-aware theming, IBM color-blind-safe support, reduce-motion, and screen-reader announcements, built on the official Flutter material_ui package."
version: 1.0.5
homepage: https://github.com/okunamutata/lazy_ally
repository: https://github.com/okunamutata/lazy_ally
issue_tracker: https://github.com/okunamutata/lazy_ally/issues
topics:
  - accessibility
  - a11y
  - theme
  - color
  - animation

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.11.1
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
